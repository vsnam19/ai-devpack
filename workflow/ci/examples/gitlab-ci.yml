# Example: CI-only vendored pack. Pin its version and provision clang/cppcheck/build tools.
# Optional agent jobs require an external trusted runner installation (topology A).
# Every non-zero command exit fails the job. Review/fix is part of devpack_run's real loop.
stages: [preflight, implement_review, gate, human]

variables:
  DEVPACK_DIR: "devpack"
  GATE_CONFIG: ".devpack/gate.toml"
  ENGINES_CONFIG: ".devpack/engines.toml"
  DEVPACK_BASE: "origin/main" # fetch this ref and choose the project's merge base

preflight:
  stage: preflight
  image: devpack-checks:latest # Python 3.11+, git, clang, cppcheck, project build tools
  script:
    - python3 $DEVPACK_DIR/enforcement/gate/project_checks.py --check lint --base "$DEVPACK_BASE" --all-components

implement_review:
  stage: implement_review
  image: devpack-agent-sandbox:latest
  rules:
    - if: '$DEVPACK_TASK'
  script:
    # Set DEVPACK_DIR to the external trusted installation for this optional agent topology.
    # The actual command includes implement -> gate -> read-only review -> bounded fix.
    - python3 $DEVPACK_DIR/runner/devpack_run.py --config "$ENGINES_CONFIG" --task-file "$DEVPACK_TASK" --gate-config "$GATE_CONFIG" --all-components
  artifacts:
    paths: [runs/]
    when: always

gate:
  stage: gate
  image: devpack-checks:latest
  script:
    - python3 $DEVPACK_DIR/enforcement/gate/gate.py --config "$GATE_CONFIG" --all-components
  artifacts:
    paths: [gate_receipt.json]
    when: always

human_approval:
  stage: human
  when: manual
  allow_failure: false
  script:
    - echo "Independent human reviewer approves in the merge request"
