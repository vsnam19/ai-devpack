# Header: Fail-closed gate configuration for the ai-devpack repository itself.
# Run from the repository root:
#   python3 enforcement/gate/gate.py --config enforcement/gate/gate.example.toml
# Projects copy this file and replace the checks with their own build, test and lint commands.
# The eval fixture lint run uses eval/fixture/preflight.toml; no rule is disabled and no baseline is used.

[[check]]
name = "project-leak-check"
cmd = ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_no_project_leaks.py"]
timeout_s = 120
required = true

[[check]]
name = "doc-links"
cmd = ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_doc_links.py"]
timeout_s = 120
required = true

[[check]]
name = "tests-unit-tests"
cmd = ["python3", "-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"]
timeout_s = 300
required = true

[[check]]
name = "enforcement-unit-tests"
cmd = ["python3", "-B", "-m", "unittest", "discover", "-s", "enforcement", "-t", ".", "-p", "test_*.py"]
timeout_s = 300
required = true

[[check]]
name = "lint-unit-tests"
cmd = ["python3", "-B", "-m", "unittest", "discover", "-s", "enforcement/lint/tests", "-t", ".", "-p", "test_*.py"]
timeout_s = 600
required = true

[[check]]
name = "eval-unit-tests"
cmd = ["python3", "-B", "-m", "unittest", "discover", "-s", "eval", "-p", "test_*.py"]
timeout_s = 300
required = true

[[check]]
name = "runner-unit-tests"
cmd = ["python3", "-B", "-m", "unittest", "discover", "-s", "runner", "-t", ".", "-p", "test_*.py"]
timeout_s = 300
required = true

[[check]]
name = "skilltest-unit-tests"
cmd = ["python3", "-B", "-m", "unittest", "discover", "-s", "skilltest", "-t", ".", "-p", "test_*.py"]
timeout_s = 300
required = true

[[check]]
name = "learning-unit-tests"
cmd = ["python3", "-B", "-m", "unittest", "discover", "-s", "learning", "-t", ".", "-p", "test_*.py"]
timeout_s = 300
required = true

[[check]]
name = "skilltest-lint"
cmd = [
  "bash", "-c",
  "set -euo pipefail; count=0; for d in knowledge/skills/*/; do [ -d \"$d\" ] || continue; count=$((count + 1)); echo \"== skilltest lint: $d\"; python3 -B skilltest/skilltest.py lint \"$d\"; done; test \"$count\" -gt 0",
]
timeout_s = 120
required = true

[[check]]
name = "eval-fixture-build-and-test"
cmd = ["bash", "eval/fixture/build_and_test.sh"]
timeout_s = 600
required = true

[[check]]
name = "eval-tasks-verify"
cmd = ["bash", "eval/tasks/verify_tasks.sh"]
timeout_s = 1800
required = true

[[check]]
name = "eval-orchestrator-goals-verify"
cmd = ["python3", "-B", "tests/verify_orchestrator_goals.py"]
timeout_s = 600
required = true

[[check]]
name = "eval-dry-run"
cmd = ["python3", "-B", "eval/run_eval.py", "--dry-run", "--tasks", "all", "--models", "sonnet,haiku", "--k", "1"]
timeout_s = 120
required = true

[[check]]
name = "eval-dry-run-runner"
cmd = ["python3", "-B", "eval/run_eval.py", "--dry-run", "--mode", "runner", "--pairs", "haiku:sonnet", "--tier", "all", "--k", "1"]
timeout_s = 120
required = true

[[check]]
name = "eval-dry-run-orchestrator"
cmd = ["python3", "-B", "eval/run_eval.py", "--dry-run", "--mode", "orchestrator", "--orchestrator", "sonnet", "--workers", "haiku", "--tier", "all", "--k", "1"]
timeout_s = 120
required = true

[[check]]
name = "eval-dry-run-memory"
cmd = ["python3", "-B", "eval/run_eval.py", "--dry-run", "--mode", "memory", "--engines", "haiku", "--tier", "all", "--k", "1"]
timeout_s = 120
required = true

[[check]]
name = "logs-render-fixture"
cmd = [
  "bash", "-c",
  "set -euo pipefail; tmp=$(mktemp -d); trap 'rm -rf \"$tmp\"' EXIT; python3 -B runner/devpack_logs.py render tests/fixtures/sample_run --out \"$tmp\"; test -s \"$tmp/transcript.md\" && test -s \"$tmp/index.html\"",
]
timeout_s = 120
required = true

[[check]]
name = "brief-lint-example"
cmd = [
  "python3", "-B", "runner/brief_lint.py",
  "orchestrator/briefs/example_implement.md",
  "--repo", "eval/fixture",
  "--engine", "haiku",
  "--engines-config", "runner/engines.example.toml",
]
timeout_s = 120
required = true

[[check]]
name = "logs-analyze-fixture"
cmd = [
  "bash", "-c",
  "set -euo pipefail; tmp=$(mktemp -d); trap 'rm -rf \"$tmp\"' EXIT; cp -r tests/fixtures/sample_run \"$tmp/run\"; python3 -B runner/devpack_logs.py analyze \"$tmp/run\" --engines runner/engines.example.toml; test -s \"$tmp/run/attribution.json\"",
]
timeout_s = 120
required = true

[[check]]
name = "eval-fixture-preflight-lint"
cmd = [
  "python3", "-B", "enforcement/lint/preflight_lint.py",
  "--config", "eval/fixture/preflight.toml",
  "--repo-root", "eval/fixture",
  "eval/fixture",
]
timeout_s = 600
required = true
