# project.example.toml - Example project configuration for ai-devpack (.devpack/project.toml).
#
# Copy this file to .devpack/project.toml in the target repository to configure
# data classification bounds, default engines, log output directory, and
# sandbox deviation policy.
#
# If .devpack/project.toml is absent, devpack_dispatch.py and agent_exec.py
# fail closed on data classification using the default: data_class = "internal".

# Confidentiality class of this repository (see policy/data_governance.md).
# Valid values (ordered lowest to highest sensitivity):
#   "public" | "internal" | "confidential" | "customer-restricted" | "secret"
# Dispatch refuses any engine whose max_data_class is lower than data_class,
# and always refuses "secret".
data_class = "internal"

# Config paths are relative to this project.toml file (pack-relative defaults
# resolve against the installed pack). Copy and edit the examples in .devpack/.
engines_config = "engines.toml"
gate_config = "gate.toml"

# Directory where v0.2 run logs (runs/<run-id>/) are written (must stay in .gitignore).
runs_root = "runs"

# Additional repository-relative test protections; nested tests are protected by default.
protected_test_globs = ["checks/**"]
# Gitignore /gate_receipt.json and /runs/ in the product repository.

# Default engine names (must match [engines.<name>] entries in engines_config).
[default_engines]
implementer = "haiku"
reviewer = "sonnet"
fixer = "haiku"
orchestrator = "sonnet"

# Sandbox policy override (see policy/sandbox.md).
# Container isolation ("docker") is the default for all runners.
# Setting allow_unsandboxed_local = true permits --isolation local without
# passing --allow-unsandboxed-local on every CLI invocation; treat this as a
# documented deviation (policy/deviations.md) because local isolation exposes
# the host filesystem and network to the agent's Bash tool.
allow_unsandboxed_local = false

# Default static analysis configuration for enforcement/static/cppcheck_check.py
# (projects with a preflight.toml may place [cppcheck] there instead; see
# policy/static_analysis.md). Coverity on company CI remains authoritative.
[cppcheck]
enable = ["warning", "style", "performance", "portability"]
std = "c++17"
include_dirs = ["include"]
suppressions_file = ""
extra_args = ["--inline-suppr"]
fail_on = ["error", "warning"]

# Optional Yocto / multi-component workspace scope (see policy/workspace_scope.md).
# When [workspace] is omitted, the entire repository is treated as a single
# implicit component in standalone tools (legacy behaviour). The project gate
# requires [workspace] and active components. When [workspace] is set, every pack
# check, brief linter, repomap, and worker edit is bounded to workspace.root
# and never touches poky/, other meta-* layers, build/, tmp/, downloads/, or
# sstate-cache/.
#
# [workspace]
# root = "meta-org/recipes-org/src"      # relative to repo root; everything else is out of scope
# exclude = ["**/third_party/**", "**/generated/**"]
#
# discover = true                       # merge discovery with explicit entries
# discovery_depth = 4                   # recursive directory depth, stops at a component
#
# # Explicit metadata overrides a discovered component at the same path.
# # CMakeLists.txt, Makefile, meson.build, *.bb / *.bbappend identify components.
# [[component]]
# name = "ipc_bus"
# path = "middleware/ipc_bus"
# Optional test patterns relative to this component; added to default protections.
# test_globs = ["specs/**"]
# Optional lint config relative to repository root; otherwise use component/preflight.toml.
# preflight_config = "config/ipc_preflight.toml"
# compile_commands = "build/ipc_bus/compile_commands.json"  # optional, repo-relative; used by cppcheck
# include_dirs = ["middleware/ipc_bus/include"]             # optional, used when no compile_commands
# build_cmd = "devtool build ipc-bus"    # optional
# test_cmd = "ctest --test-dir build/ipc_bus --output-on-failure"  # optional
#
# [scan]
# default = "all"                        # CI uses --all-components; selected is local-only
# selected = ["ipc_bus"]
